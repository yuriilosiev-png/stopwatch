<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Секундомер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Секундомер">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0f;
    --fg: #f2f4f8;
    --accent: #3ddc97;
    --stop: #ff5a5f;
    --rest: #ffb454;
    --dim: #1a1c24;
    --border: #2a2d38;
    --muted: #6b7280;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  /* ---------- Вкладки ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }

  /* ---------- Экраны ---------- */
  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 24px;
  }

  .time {
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Roboto Mono", "Consolas", monospace;
    font-weight: 300;
    letter-spacing: 1px;
    line-height: 1;
    text-align: center;
  }
  .time .main { font-size: clamp(56px, 22vw, 120px); }
  .time .ms { font-size: clamp(24px, 9vw, 48px); color: var(--accent); margin-left: 4px; }

  .controls { display: flex; gap: 20px; width: 100%; max-width: 420px; }

  button.big {
    flex: 1;
    border: none;
    border-radius: 22px;
    padding: 22px 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #0a0a0f;
    cursor: pointer;
    transition: transform .08s ease, opacity .15s ease;
  }
  button.big:active { transform: scale(0.94); }

  #startStop { background: var(--accent); }
  #startStop.stop { background: var(--stop); color: #fff; }

  #reset { background: var(--dim); color: var(--fg); border: 1px solid var(--border); }
  #reset:disabled { opacity: 0.4; cursor: default; }

  /* ---------- Таймер раундов ---------- */
  #timerRun {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  .phase-label {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .phase-work { color: var(--accent); }
  .phase-rest { color: var(--rest); }
  .round-info { font-size: 16px; color: var(--muted); }
  .big-count {
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Roboto Mono", monospace;
    font-size: clamp(72px, 30vw, 160px);
    font-weight: 300;
    line-height: 1;
  }

  /* ---------- Настройка фаз ---------- */
  .setup { flex: 1; overflow-y: auto; padding: 16px; }
  .setup h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 8px 4px; }

  .phase-row {
    background: var(--dim);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .phase-row .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .phase-row input.name {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
  }
  .phase-row .del {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--stop);
    border-radius: 10px;
    width: 42px; height: 42px;
    font-size: 20px;
    cursor: pointer;
  }
  .phase-row .bottom { display: flex; gap: 10px; align-items: center; }
  .dur-box { display: flex; align-items: center; gap: 6px; }
  .dur-box input {
    width: 56px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 8px;
    font-size: 15px;
    text-align: center;
  }
  .dur-box span { color: var(--muted); font-size: 13px; }
  select.sound {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 8px;
    font-size: 15px;
  }
  .play-snd {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 10px;
    width: 42px; height: 42px;
    font-size: 18px;
    cursor: pointer;
  }

  .add-phase {
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--border);
    color: var(--accent);
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--dim);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .opt-row label { font-size: 15px; }
  .opt-row .small-in {
    width: 64px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 8px;
    font-size: 15px;
    text-align: center;
  }
  /* переключатель */
  .switch { position: relative; width: 50px; height: 28px; flex: none; }
  /* Чекбокс невидим, но занимает всю область переключателя с запасом:
     без этого нажимать не по чему (нулевой размер = нет зоны касания). */
  .switch input {
    position: absolute; inset: -10px -8px;
    width: auto; height: auto; margin: 0;
    opacity: 0; z-index: 2; cursor: pointer;
  }
  .slider {
    position: absolute; inset: 0;
    background: var(--border); border-radius: 28px;
    transition: .2s;
  }
  .slider:before {
    content: ""; position: absolute;
    width: 22px; height: 22px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(22px); }

  .footer-btns { display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom) + 24px); }
  .footer-btns button {
    flex: 1; border: none; border-radius: 18px; padding: 18px 0;
    font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform .08s ease;
  }
  .footer-btns button:active { transform: scale(0.95); }
  #timerStart { background: var(--accent); color: #0a0a0f; }
  #timerStop  { background: var(--stop); color: #fff; }
  #timerEdit  { background: var(--dim); color: var(--fg); border: 1px solid var(--border); }

  /* ---------- Баннер обновления ---------- */
  .update-banner {
    position: fixed;
    left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--accent);
    color: #0a0a0f;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 100;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(120%); } to { transform: translateY(0); } }
  .update-banner span { font-size: 15px; font-weight: 600; }
  .update-banner button {
    background: #0a0a0f;
    color: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Обратный отсчёт ---------- */
  .cd-card {
    background: var(--dim); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .cd-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit;
  }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .presets button {
    background: var(--bg); border: 1px solid var(--border); color: var(--accent);
    border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .08s ease;
  }
  .presets button:active { transform: scale(0.94); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.45; padding: 4px 6px 8px; }
  .hint.err { color: var(--stop); }

  #cdRun {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
  }
  .cd-title { font-size: 18px; font-weight: 700; text-align: center; word-break: break-word; }
  .cd-units { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .cd-unit {
    background: var(--dim); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; text-align: center; min-width: 68px;
  }
  .cd-unit b {
    display: block; font-size: 26px; font-weight: 400;
    font-variant-numeric: tabular-nums; font-family: "SF Mono", "Roboto Mono", monospace;
  }
  .cd-unit span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .cd-clock {
    font-variant-numeric: tabular-nums; font-family: "SF Mono", "Roboto Mono", monospace;
    font-size: clamp(44px, 16vw, 92px); font-weight: 300; line-height: 1;
  }
  .cd-clock.fired { color: var(--stop); }
  .cd-sub { font-size: 15px; color: var(--muted); text-align: center; }
  .cd-shade-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--dim); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 16px; font-size: 15px; width: 100%; max-width: 420px;
  }
  #cdPause { background: var(--rest); color: #0a0a0f; }
  #cdStop  { background: var(--dim); color: var(--fg); border: 1px solid var(--border); }
  #cdStop.alarm { background: var(--stop); color: #fff; border: none; }

  .lang-btn {
    align-self: center; background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 10px; padding: 7px 10px;
    font-size: 13px; font-weight: 700; cursor: pointer; margin-left: 4px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" data-screen="sw" data-i18n="tab.sw">Секундомер</div>
    <div class="tab" data-screen="cd" data-i18n="tab.cd">Отсчёт</div>
    <div class="tab" data-screen="timer" data-i18n="tab.rounds">Раунды</div>
    <button class="lang-btn" id="langBtn">RU</button>
  </div>

  <!-- ===== СЕКУНДОМЕР ===== -->
  <div class="screen active" id="sw">
    <div class="center">
      <div class="time" id="display">
        <span class="main" id="main">00:00</span><span class="ms" id="ms">.00</span>
      </div>
      <div class="controls">
        <button class="big" id="startStop" data-i18n="btn.start">Старт</button>
        <button class="big" id="reset" data-i18n="btn.reset" disabled>Сброс</button>
      </div>
    </div>
  </div>

  <!-- ===== ОБРАТНЫЙ ОТСЧЁТ ===== -->
  <div class="screen" id="cd">

    <!-- Настройка -->
    <div class="setup" id="cdSetup">
      <h3 data-i18n="cd.head">Дата и время события</h3>
      <div class="cd-card">
        <input class="cd-input" type="text" id="cdName" maxlength="60" data-i18n-ph="cd.namePh" placeholder="Название события">
        <input class="cd-input" type="datetime-local" id="cdTarget" step="1">
        <div class="presets" id="cdPresets"></div>
      </div>

      <h3 data-i18n="cd.opts">Параметры</h3>
      <div class="opt-row">
        <label data-i18n="cd.shade">Отображать в шторке</label>
        <span class="switch"><input type="checkbox" id="cdShade"><span class="slider"></span></span>
      </div>
      <div class="opt-row">
        <label data-i18n="cd.sound">Сигнал по окончании (30 сек)</label>
        <span class="switch"><input type="checkbox" id="cdSound" checked><span class="slider"></span></span>
      </div>
      <div class="hint" id="cdHint"></div>
    </div>

    <!-- Запуск -->
    <div id="cdRun" class="hidden">
      <div class="cd-title" id="cdRunName"></div>
      <div class="cd-units" id="cdUnits"></div>
      <div class="cd-clock" id="cdClock">00:00:00</div>
      <div class="cd-sub" id="cdSub"></div>
      <div class="cd-shade-row">
        <span data-i18n="cd.shade">Отображать в шторке</span>
        <span class="switch"><input type="checkbox" id="cdShadeRun"><span class="slider"></span></span>
      </div>
    </div>

    <div class="footer-btns" id="cdSetupBtns">
      <button id="cdStart" data-i18n="btn.start">Старт</button>
    </div>
    <div class="footer-btns hidden" id="cdRunBtns">
      <button id="cdPause" data-i18n="btn.pause">Пауза</button>
      <button id="cdStop" data-i18n="btn.reset">Сброс</button>
    </div>
  </div>

  <!-- ===== ТАЙМЕР РАУНДОВ ===== -->
  <div class="screen" id="timer">

    <!-- Настройка -->
    <div class="setup" id="timerSetup">
      <h3 data-i18n="t.phases">Фазы (повторяются по кругу)</h3>
      <div id="phaseList"></div>
      <button class="add-phase" id="addPhase" data-i18n="t.addPhase">+ Добавить фазу</button>

      <h3 data-i18n="t.params">Параметры</h3>
      <div class="opt-row">
        <label data-i18n="t.cycles">Кол-во циклов (раундов)</label>
        <input class="small-in" type="number" id="cycles" min="1" max="99" value="3">
      </div>
      <div class="opt-row">
        <label data-i18n="t.warn">Сигнал-предупреждение за 10 сек</label>
        <span class="switch"><input type="checkbox" id="warnToggle" checked><span class="slider"></span></span>
      </div>
    </div>

    <!-- Запуск -->
    <div id="timerRun" class="hidden">
      <div class="phase-label phase-work" id="rPhase">РАУНД</div>
      <div class="big-count" id="rCount">00:00</div>
      <div class="round-info" id="rInfo">Цикл 1 из 3</div>
    </div>

    <div class="footer-btns" id="setupBtns">
      <button id="timerStart" data-i18n="btn.start">Старт</button>
    </div>
    <div class="footer-btns hidden" id="runBtns">
      <button id="timerStop" data-i18n="btn.stop">Стоп</button>
      <button id="timerEdit" data-i18n="btn.reset">Сброс</button>
    </div>
  </div>

  <!-- Баннер обновления -->
  <div class="update-banner hidden" id="updateBanner">
    <span data-i18n="upd.text">Доступно обновление</span>
    <button id="updateBtn" data-i18n="upd.btn">Обновить</button>
  </div>

<script>
  /* ============ I18N (RU / EN) ============ */
  const I18N = {
    ru: {
      'app.title': 'Секундомер',
      'tab.sw': 'Секундомер', 'tab.cd': 'Отсчёт', 'tab.rounds': 'Раунды',
      'btn.start': 'Старт', 'btn.stop': 'Стоп', 'btn.reset': 'Сброс',
      'btn.pause': 'Пауза', 'btn.resume': 'Продолжить', 'btn.stopAlarm': 'Выключить сигнал',
      'cd.head': 'Дата и время события',
      'cd.namePh': 'Название события',
      'cd.opts': 'Параметры',
      'cd.shade': 'Отображать в шторке',
      'cd.sound': 'Сигнал по окончании (30 сек)',
      'cd.hint': 'Отсчёт идёт от системных часов: работает при свёрнутом приложении и после перезагрузки. Шторка и звук на заблокированном экране требуют установленного APK.',
      'cd.errEmpty': 'Укажите дату и время события',
      'cd.errPast': 'Выбранное время уже прошло',
      'cd.until': 'До события',
      'cd.done': 'Время вышло',
      'cd.paused': 'Пауза',
      'cd.at': 'Событие: ',
      'cd.noName': 'Событие',
      'u.y': 'лет', 'u.mo': 'мес', 'u.w': 'нед', 'u.d': 'дн',
      'u.h': 'ч', 'u.min': 'мин', 'u.sec': 'сек',
      'p.min1': '+1 мин', 'p.min5': '+5 мин', 'p.min15': '+15 мин', 'p.h1': '+1 час',
      'p.d1': '+1 день', 'p.w1': '+1 неделя', 'p.mo1': '+1 месяц', 'p.y1': '+1 год',
      't.phases': 'Фазы (повторяются по кругу)',
      't.addPhase': '+ Добавить фазу',
      't.params': 'Параметры',
      't.cycles': 'Кол-во циклов (раундов)',
      't.warn': 'Сигнал-предупреждение за 10 сек',
      't.round': 'Раунд', 't.rest': 'Отдых', 't.phaseN': 'Фаза ',
      't.cycleOf': 'Цикл {a} из {b}',
      't.ready': 'ГОТОВО', 't.finished': 'Тренировка завершена',
      'snd.none': 'Без звука', 'snd.beep': 'Бип', 'snd.whistle': 'Свисток', 'snd.gong': 'Гонг',
      'upd.text': 'Доступно обновление', 'upd.btn': 'Обновить'
    },
    en: {
      'app.title': 'Stopwatch',
      'tab.sw': 'Stopwatch', 'tab.cd': 'Reverse', 'tab.rounds': 'Rounds',
      'btn.start': 'Start', 'btn.stop': 'Stop', 'btn.reset': 'Reset',
      'btn.pause': 'Pause', 'btn.resume': 'Resume', 'btn.stopAlarm': 'Stop alarm',
      'cd.head': 'Event date and time',
      'cd.namePh': 'Event name',
      'cd.opts': 'Options',
      'cd.shade': 'Show in notification shade',
      'cd.sound': 'Alarm when finished (30 sec)',
      'cd.hint': 'The countdown uses the system clock: it keeps working when the app is minimised or after a reboot. The notification shade and the locked-screen alarm require the installed APK.',
      'cd.errEmpty': 'Set the event date and time',
      'cd.errPast': 'The selected time has already passed',
      'cd.until': 'Time left',
      'cd.done': 'Time is up',
      'cd.paused': 'Paused',
      'cd.at': 'Event: ',
      'cd.noName': 'Event',
      'u.y': 'yr', 'u.mo': 'mo', 'u.w': 'wk', 'u.d': 'd',
      'u.h': 'h', 'u.min': 'min', 'u.sec': 'sec',
      'p.min1': '+1 min', 'p.min5': '+5 min', 'p.min15': '+15 min', 'p.h1': '+1 hour',
      'p.d1': '+1 day', 'p.w1': '+1 week', 'p.mo1': '+1 month', 'p.y1': '+1 year',
      't.phases': 'Phases (looped)',
      't.addPhase': '+ Add phase',
      't.params': 'Options',
      't.cycles': 'Number of cycles (rounds)',
      't.warn': 'Warning signal 10 sec before end',
      't.round': 'Round', 't.rest': 'Rest', 't.phaseN': 'Phase ',
      't.cycleOf': 'Cycle {a} of {b}',
      't.ready': 'DONE', 't.finished': 'Workout finished',
      'snd.none': 'No sound', 'snd.beep': 'Beep', 'snd.whistle': 'Whistle', 'snd.gong': 'Gong',
      'upd.text': 'Update available', 'upd.btn': 'Update'
    }
  };

  const LANG_KEY = 'sw.lang';
  let LANG = (function () {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === 'ru' || saved === 'en') return saved;
    } catch (e) {}
    return (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  })();

  function t(key, vars) {
    let str = (I18N[LANG] && I18N[LANG][key]) || (I18N.ru[key]) || key;
    if (vars) for (const k in vars) str = str.replace('{' + k + '}', vars[k]);
    return str;
  }

  /* ============ ЗВУКИ (Web Audio, офлайн) ============ */
  let audioCtx = null;
  function ac() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type, gain) {
    const ctx = ac();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    const t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.5, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }

  const SOUNDS = {
    none:    { name: 'snd.none', play: () => {} },
    beep:    { name: 'snd.beep',       play: () => { tone(880, 0, 0.15, 'square', 0.4); } },
    whistle: { name: 'snd.whistle',   play: () => {
                 // высокий, чуть «плавающий» тон + вторая гармоника
                 tone(2100, 0, 0.45, 'sine', 0.35);
                 tone(2650, 0, 0.45, 'sine', 0.18);
               } },
    gong:    { name: 'snd.gong',      play: () => {
                 // низкий удар с обертонами и долгим затуханием
                 tone(140, 0, 1.6, 'sine', 0.5);
                 tone(220, 0, 1.4, 'sine', 0.3);
                 tone(330, 0, 1.2, 'triangle', 0.2);
               } }
  };

  function playSound(key) { (SOUNDS[key] || SOUNDS.none).play(); }
  function warnBeep() { tone(660, 0, 0.1, 'square', 0.25); }

  /* ============ ВКЛАДКИ ============ */
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.screen).classList.add('active');
    });
  });

  /* ============ СЕКУНДОМЕР ============ */
  const mainEl  = document.getElementById('main');
  const msEl    = document.getElementById('ms');
  const ssBtn   = document.getElementById('startStop');
  const resetBtn= document.getElementById('reset');

  let startTime = 0, elapsed = 0, swRunning = false, rafId = null;

  function fmt(t) {
    const totalMs = Math.floor(t);
    const ms  = Math.floor((totalMs % 1000) / 10);
    const sec = Math.floor(totalMs / 1000) % 60;
    const min = Math.floor(totalMs / 60000) % 60;
    const hr  = Math.floor(totalMs / 3600000);
    const pad = n => String(n).padStart(2, '0');
    const main = hr > 0 ? `${pad(hr)}:${pad(min)}:${pad(sec)}` : `${pad(min)}:${pad(sec)}`;
    return { main, ms: '.' + pad(ms) };
  }
  function render(t) { const f = fmt(t); mainEl.textContent = f.main; msEl.textContent = f.ms; }
  function tick() {
    render(elapsed + (performance.now() - startTime));
    rafId = requestAnimationFrame(tick);
  }
  function swStart() {
    swRunning = true; startTime = performance.now();
    rafId = requestAnimationFrame(tick);
    ssBtn.textContent = t('btn.stop'); ssBtn.classList.add('stop');
    resetBtn.disabled = false;
  }
  function swStop() {
    swRunning = false; cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTime; render(elapsed);
    ssBtn.textContent = t('btn.start'); ssBtn.classList.remove('stop');
  }
  function swReset() {
    swRunning = false; cancelAnimationFrame(rafId);
    elapsed = 0; render(0);
    ssBtn.textContent = t('btn.start'); ssBtn.classList.remove('stop');
    resetBtn.disabled = true;
  }
  ssBtn.addEventListener('click', () => { ac(); swRunning ? swStop() : swStart(); });
  resetBtn.addEventListener('click', swReset);
  render(0);

  /* ============ ТАЙМЕР РАУНДОВ ============ */
  // фаза: { name, min, sec, sound }
  let phases = [
    { name: t('t.round'), min: 2, sec: 0, sound: 'gong' },
    { name: t('t.rest'),  min: 1, sec: 0, sound: 'whistle' }
  ];

  const phaseList = document.getElementById('phaseList');

  function soundOptions(selected) {
    return Object.keys(SOUNDS).map(k =>
      `<option value="${k}" ${k === selected ? 'selected' : ''}>${t(SOUNDS[k].name)}</option>`
    ).join('');
  }

  function renderPhases() {
    phaseList.innerHTML = '';
    phases.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'phase-row';
      row.innerHTML = `
        <div class="top">
          <input class="name" type="text" value="${p.name}" data-i="${i}" data-f="name">
          <button class="del" data-i="${i}">✕</button>
        </div>
        <div class="bottom">
          <div class="dur-box">
            <input type="number" min="0" max="59" value="${p.min}" data-i="${i}" data-f="min"><span>${t('u.min')}</span>
          </div>
          <div class="dur-box">
            <input type="number" min="0" max="59" value="${p.sec}" data-i="${i}" data-f="sec"><span>${t('u.sec')}</span>
          </div>
          <select class="sound" data-i="${i}" data-f="sound">${soundOptions(p.sound)}</select>
          <button class="play-snd" data-i="${i}">▶</button>
        </div>`;
      phaseList.appendChild(row);
    });

    // обработчики ввода
    phaseList.querySelectorAll('input.name, select.sound, .dur-box input').forEach(el => {
      el.addEventListener('change', e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        if (f === 'name') phases[i].name = e.target.value;
        else if (f === 'sound') phases[i].sound = e.target.value;
        else phases[i][f] = Math.max(0, Math.min(59, parseInt(e.target.value) || 0));
      });
    });
    phaseList.querySelectorAll('.del').forEach(b => {
      b.addEventListener('click', e => {
        if (phases.length <= 1) return;
        phases.splice(+e.target.dataset.i, 1); renderPhases();
      });
    });
    phaseList.querySelectorAll('.play-snd').forEach(b => {
      b.addEventListener('click', e => { ac(); playSound(phases[+e.target.dataset.i].sound); });
    });
  }
  renderPhases();

  document.getElementById('addPhase').addEventListener('click', () => {
    phases.push({ name: t('t.phaseN') + (phases.length + 1), min: 1, sec: 0, sound: 'beep' });
    renderPhases();
  });

  // --- запуск таймера ---
  const tSetup = document.getElementById('timerSetup');
  const tRun   = document.getElementById('timerRun');
  const setupBtns = document.getElementById('setupBtns');
  const runBtns   = document.getElementById('runBtns');
  const rPhase = document.getElementById('rPhase');
  const rCount = document.getElementById('rCount');
  const rInfo  = document.getElementById('rInfo');

  let tInterval = null, tCurPhase = 0, tCurCycle = 1, tTotalCycles = 3, tRemain = 0, tWarned = false, tWarn = true;

  function fmtSec(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function showPhase() {
    const p = phases[tCurPhase];
    rPhase.textContent = p.name.toUpperCase();
    // цвет: первая фаза в списке = "работа", остальные с "отдых"/"rest" в имени = оранжевый
    const isRest = /отдых|rest|пауза|перерыв/i.test(p.name);
    rPhase.className = 'phase-label ' + (isRest ? 'phase-rest' : 'phase-work');
    rCount.textContent = fmtSec(tRemain);
    rInfo.textContent = t('t.cycleOf', { a: tCurCycle, b: tTotalCycles });
  }

  function startPhase() {
    const p = phases[tCurPhase];
    tRemain = p.min * 60 + p.sec;
    tWarned = false;
    if (tRemain <= 0) { nextPhase(); return; }
    playSound(p.sound); // сигнал в начале фазы
    showPhase();
  }

  function nextPhase() {
    tCurPhase++;
    if (tCurPhase >= phases.length) {
      tCurPhase = 0;
      tCurCycle++;
      if (tCurCycle > tTotalCycles) { finishTimer(); return; }
    }
    startPhase();
  }

  function timerTick() {
    tRemain--;
    if (tWarn && !tWarned && tRemain === 10) { tWarned = true; warnBeep(); }
    if (tRemain <= 0) { nextPhase(); return; }
    showPhase();
  }

  function finishTimer() {
    clearInterval(tInterval); tInterval = null;
    playSound('gong');
    rPhase.textContent = t('t.ready');
    rPhase.className = 'phase-label phase-work';
    rCount.textContent = '00:00';
    rInfo.textContent = t('t.finished');
    // через 2 сек вернуть к настройке
    setTimeout(stopTimer, 2500);
  }

  function startTimer() {
    ac();
    tTotalCycles = Math.max(1, parseInt(document.getElementById('cycles').value) || 1);
    tWarn = document.getElementById('warnToggle').checked;
    tCurPhase = 0; tCurCycle = 1;
    tSetup.classList.add('hidden'); tRun.classList.remove('hidden');
    setupBtns.classList.add('hidden'); runBtns.classList.remove('hidden');
    startPhase();
    tInterval = setInterval(timerTick, 1000);
  }

  function stopTimer() {
    if (tInterval) { clearInterval(tInterval); tInterval = null; }
    tRun.classList.add('hidden'); tSetup.classList.remove('hidden');
    runBtns.classList.add('hidden'); setupBtns.classList.remove('hidden');
  }

  document.getElementById('timerStart').addEventListener('click', startTimer);
  document.getElementById('timerStop').addEventListener('click', stopTimer);
  document.getElementById('timerEdit').addEventListener('click', stopTimer);

  /* ============ МОСТ К НАТИВНОЙ ЧАСТИ (APK) ============
     Контракт JS -> Android (интерфейс window.Android):
       startCountdown(targetEpochMs: String, title: String, shade: Boolean, sound: Boolean)
       stopCountdown()
       updateShade(shade: Boolean)
     В браузере/PWA методов нет — все вызовы молча игнорируются.        */
  const Native = {
    available() {
      return typeof window.Android === 'object' && window.Android !== null;
    },
    call(fn) {
      const args = Array.prototype.slice.call(arguments, 1);
      try {
        if (this.available() && typeof window.Android[fn] === 'function') {
          window.Android[fn].apply(window.Android, args);
          return true;
        }
      } catch (e) { /* нативка недоступна — не критично */ }
      return false;
    }
  };

  /* ============ WAKE LOCK (экран не гаснет при открытом приложении) ============ */
  let wakeLock = null;
  async function wakeAcquire() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* отказано или не поддерживается */ }
  }
  function wakeRelease() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  /* ============ ОБРАТНЫЙ ОТСЧЁТ ============ */
  const CD_KEY = 'cd.state.v1';
  const ALARM_MS = 30000;          // длительность сигнала «пи-пи, пи-пи»
  const ALARM_PERIOD = 1600;       // период повтора группы сигналов

  const cdName   = document.getElementById('cdName');
  const cdTarget = document.getElementById('cdTarget');
  const cdShade  = document.getElementById('cdShade');
  const cdSound  = document.getElementById('cdSound');
  const cdHint   = document.getElementById('cdHint');
  const cdPresetsEl = document.getElementById('cdPresets');
  const cdSetup  = document.getElementById('cdSetup');
  const cdRun    = document.getElementById('cdRun');
  const cdSetupBtns = document.getElementById('cdSetupBtns');
  const cdRunBtns   = document.getElementById('cdRunBtns');
  const cdRunName = document.getElementById('cdRunName');
  const cdUnits   = document.getElementById('cdUnits');
  const cdClock   = document.getElementById('cdClock');
  const cdSub     = document.getElementById('cdSub');
  const cdShadeRun = document.getElementById('cdShadeRun');
  const cdStartBtn = document.getElementById('cdStart');
  const cdPauseBtn = document.getElementById('cdPause');
  const cdStopBtn  = document.getElementById('cdStop');

  // Состояние отсчёта. Всё считается от абсолютной метки времени (target),
  // а не от накопленных тиков — поэтому переживает сворачивание и перезагрузку.
  let CD = {
    running: false,
    paused: false,
    target: 0,      // epoch ms момента события
    remain: 0,      // остаток в мс на момент паузы
    name: '',
    shade: false,
    sound: true,
    fired: false,   // ноль достигнут
    firedAt: 0      // когда именно достигнут (для дозвона сигнала)
  };

  let cdInterval = null;
  let alarmInterval = null;
  let alarmEnd = 0;

  function cdSave() {
    try { localStorage.setItem(CD_KEY, JSON.stringify(CD)); } catch (e) {}
  }
  function cdLoad() {
    try {
      const raw = localStorage.getItem(CD_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') CD = Object.assign(CD, o);
    } catch (e) {}
  }

  /* ---- Календарная арифметика (год = та же дата в следующем году) ---- */
  function addPeriod(date, unit, n) {
    const d = new Date(date.getTime());
    if (unit === 'min') d.setMinutes(d.getMinutes() + n);
    else if (unit === 'h') d.setHours(d.getHours() + n);
    else if (unit === 'd') d.setDate(d.getDate() + n);
    else if (unit === 'w') d.setDate(d.getDate() + 7 * n);
    else if (unit === 'mo' || unit === 'y') {
      // прибавляем месяцы/годы с прижатием к концу месяца:
      // 31 января + 1 месяц = 28/29 февраля, 29 февраля + 1 год = 28 февраля
      const day = d.getDate();
      d.setDate(1);
      if (unit === 'mo') d.setMonth(d.getMonth() + n);
      else d.setFullYear(d.getFullYear() + n);
      const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, lastDay));
    }
    return d;
  }

  // Разложение интервала на календарные единицы (с учётом длины месяцев и високосных лет)
  function breakdown(fromMs, toMs) {
    const a = new Date(fromMs), b = new Date(toMs);
    let y = b.getFullYear() - a.getFullYear();
    let mo = b.getMonth() - a.getMonth();
    let d = b.getDate() - a.getDate();
    let h = b.getHours() - a.getHours();
    let mi = b.getMinutes() - a.getMinutes();
    let se = b.getSeconds() - a.getSeconds();
    if (se < 0) { se += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) {
      const prevMonthDays = new Date(b.getFullYear(), b.getMonth(), 0).getDate();
      d += prevMonthDays; mo--;
    }
    if (mo < 0) { mo += 12; y--; }
    return { y: y, mo: mo, d: d, h: h, mi: mi, s: se };
  }

  const pad2 = n => String(n).padStart(2, '0');

  function toLocalInputValue(date) {
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate()) +
           'T' + pad2(date.getHours()) + ':' + pad2(date.getMinutes()) + ':' + pad2(date.getSeconds());
  }

  const CD_PRESETS = [
    ['p.min1', 'min', 1], ['p.min5', 'min', 5], ['p.min15', 'min', 15], ['p.h1', 'h', 1],
    ['p.d1', 'd', 1], ['p.w1', 'w', 1], ['p.mo1', 'mo', 1], ['p.y1', 'y', 1]
  ];

  function renderPresets() {
    cdPresetsEl.innerHTML = '';
    CD_PRESETS.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t(p[0]);
      b.addEventListener('click', () => {
        const base = new Date();
        base.setMilliseconds(0);
        cdTarget.value = toLocalInputValue(addPeriod(base, p[1], p[2]));
        cdHint.classList.remove('err');
        cdHint.textContent = t('cd.hint');
      });
      cdPresetsEl.appendChild(b);
    });
  }

  /* ---- Сигнал «пи-пи, пи-пи» ---- */
  function beepGroup() {
    tone(1046, 0.00, 0.11, 'square', 0.5);
    tone(1046, 0.18, 0.11, 'square', 0.5);
    tone(1046, 0.50, 0.11, 'square', 0.5);
    tone(1046, 0.68, 0.11, 'square', 0.5);
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120, 200, 120, 60, 120]); } catch (e) {}
  }
  function alarmStart(durationMs) {
    alarmStop();
    ac();
    alarmEnd = Date.now() + Math.max(0, durationMs);
    beepGroup();
    alarmInterval = setInterval(() => {
      if (Date.now() >= alarmEnd) { alarmStop(); cdRender(); return; }
      beepGroup();
    }, ALARM_PERIOD);
  }
  function alarmStop() {
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
    alarmEnd = 0;
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
  }
  const alarmActive = () => alarmInterval !== null;

  /* ---- Отрисовка ---- */
  function unitChip(value, key) {
    return '<div class="cd-unit"><b>' + value + '</b><span>' + t(key) + '</span></div>';
  }

  function cdRender() {
    if (!CD.running) return;
    const now = Date.now();
    const left = CD.paused ? CD.remain : (CD.target - now);

    cdRunName.textContent = CD.name || t('cd.noName');
    if (cdShadeRun.checked !== CD.shade) cdShadeRun.checked = CD.shade;

    if (left <= 0) {
      if (!CD.fired) {
        CD.fired = true;
        CD.firedAt = CD.target;
        cdSave();
        if (CD.sound) alarmStart(ALARM_MS);
      }
      cdUnits.innerHTML = '';
      cdClock.textContent = '00:00:00';
      cdClock.classList.add('fired');
      cdSub.textContent = t('cd.done');
      cdPauseBtn.classList.add('hidden');
      cdStopBtn.textContent = alarmActive() ? t('btn.stopAlarm') : t('btn.reset');
      cdStopBtn.classList.toggle('alarm', alarmActive());
      return;
    }

    const b = CD.paused ? breakdown(now, now + CD.remain) : breakdown(now, CD.target);
    let chips = '';
    if (b.y > 0) {
      chips = unitChip(b.y, 'u.y') + unitChip(b.mo, 'u.mo') + unitChip(b.d, 'u.d');
    } else if (b.mo > 0) {
      chips = unitChip(b.mo, 'u.mo') + unitChip(b.d, 'u.d');
    } else if (b.d >= 7) {
      chips = unitChip(Math.floor(b.d / 7), 'u.w') + unitChip(b.d % 7, 'u.d');
    } else if (b.d > 0) {
      chips = unitChip(b.d, 'u.d');
    }
    cdUnits.innerHTML = chips;
    cdClock.textContent = pad2(b.h) + ':' + pad2(b.mi) + ':' + pad2(b.s);
    cdClock.classList.remove('fired');
    cdSub.textContent = CD.paused
      ? t('cd.paused')
      : t('cd.at') + new Date(CD.target).toLocaleString(LANG === 'ru' ? 'ru-RU' : 'en-GB');

    cdPauseBtn.classList.remove('hidden');
    cdPauseBtn.textContent = CD.paused ? t('btn.resume') : t('btn.pause');
    cdStopBtn.textContent = t('btn.reset');
    cdStopBtn.classList.remove('alarm');
  }

  function cdLoopStart() {
    if (cdInterval) clearInterval(cdInterval);
    cdInterval = setInterval(cdRender, 250);
  }
  function cdLoopStop() {
    if (cdInterval) { clearInterval(cdInterval); cdInterval = null; }
  }

  function cdShowRun(on) {
    cdSetup.classList.toggle('hidden', on);
    cdRun.classList.toggle('hidden', !on);
    cdSetupBtns.classList.toggle('hidden', on);
    cdRunBtns.classList.toggle('hidden', !on);
  }

  /* ---- Управление ---- */
  function cdStart() {
    ac(); // разблокировать Web Audio жестом пользователя
    const raw = cdTarget.value;
    if (!raw) { cdHint.textContent = t('cd.errEmpty'); cdHint.classList.add('err'); return; }
    const ts = new Date(raw).getTime();
    if (!isFinite(ts)) { cdHint.textContent = t('cd.errEmpty'); cdHint.classList.add('err'); return; }
    if (ts <= Date.now() + 500) { cdHint.textContent = t('cd.errPast'); cdHint.classList.add('err'); return; }

    cdHint.classList.remove('err');
    cdHint.textContent = t('cd.hint');

    CD.running = true;
    CD.paused = false;
    CD.fired = false;
    CD.firedAt = 0;
    CD.target = ts;
    CD.remain = 0;
    CD.name = (cdName.value || '').trim();
    CD.shade = cdShade.checked;
    CD.sound = cdSound.checked;
    cdSave();

    Native.call('startCountdown', String(CD.target), CD.name || t('cd.noName'), CD.shade, CD.sound);
    wakeAcquire();
    cdShowRun(true);
    cdRender();
    cdLoopStart();
  }

  function cdPauseResume() {
    ac();
    if (CD.fired) return;
    if (CD.paused) {
      CD.target = Date.now() + CD.remain;
      CD.paused = false;
      Native.call('startCountdown', String(CD.target), CD.name || t('cd.noName'), CD.shade, CD.sound);
      wakeAcquire();
    } else {
      CD.remain = Math.max(0, CD.target - Date.now());
      CD.paused = true;
      Native.call('stopCountdown');
      wakeRelease();
    }
    cdSave();
    cdRender();
  }

  function cdStop() {
    if (alarmActive()) {          // первое нажатие при звонящем сигнале — только глушим звук
      alarmStop();
      cdRender();
      return;
    }
    alarmStop();
    cdLoopStop();
    Native.call('stopCountdown');
    wakeRelease();
    CD.running = false;
    CD.paused = false;
    CD.fired = false;
    CD.firedAt = 0;
    CD.remain = 0;
    cdSave();
    cdShowRun(false);
    cdClock.classList.remove('fired');
  }

  cdStartBtn.addEventListener('click', cdStart);
  cdPauseBtn.addEventListener('click', cdPauseResume);
  cdStopBtn.addEventListener('click', cdStop);

  function applyShade(on) {
    CD.shade = !!on;
    cdShade.checked = CD.shade;
    cdShadeRun.checked = CD.shade;
    cdSave();
    // На запущенном отсчёте переключаем сервис на лету;
    // на паузе состояние просто запомнится до возобновления.
    if (CD.running && !CD.paused) Native.call('updateShade', CD.shade);
  }
  cdShade.addEventListener('change', () => applyShade(cdShade.checked));
  cdShadeRun.addEventListener('change', () => applyShade(cdShadeRun.checked));
  cdSound.addEventListener('change', () => { CD.sound = cdSound.checked; cdSave(); });
  cdName.addEventListener('change', () => {
    if (CD.running) { CD.name = (cdName.value || '').trim(); cdSave(); cdRender(); }
  });

  /* ---- Восстановление после перезапуска ---- */
  function cdRestore() {
    cdLoad();
    cdName.value = CD.name || '';
    cdShade.checked = !!CD.shade;
    cdShadeRun.checked = !!CD.shade;
    cdSound.checked = CD.sound !== false;
    if (CD.target) cdTarget.value = toLocalInputValue(new Date(CD.target));

    if (!CD.running) { cdShowRun(false); return; }

    cdShowRun(true);
    const now = Date.now();
    if (!CD.paused && now >= CD.target) {
      CD.fired = true;
      if (!CD.firedAt) CD.firedAt = CD.target;
      const since = now - CD.firedAt;
      // сигнал дозванивает только остаток 30-секундного окна
      if (CD.sound && since < ALARM_MS) alarmStart(ALARM_MS - since);
    }
    if (!CD.paused) wakeAcquire();
    cdRender();
    cdLoopStart();
  }

  /* ---- Пересчёт при возврате в приложение ---- */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (CD.running && !CD.paused) { wakeAcquire(); cdRender(); }
  });

  /* ============ ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ============ */
  function applyLang(lang) {
    LANG = (lang === 'ru' || lang === 'en') ? lang : 'en';
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}

    document.documentElement.lang = LANG;
    document.title = t('app.title');

    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPh);
    });

    document.getElementById('langBtn').textContent = LANG === 'ru' ? 'EN' : 'RU';

    // динамика, которую нельзя покрыть атрибутами
    ssBtn.textContent = swRunning ? t('btn.stop') : t('btn.start');
    renderPhases();
    renderPresets();
    if (!cdHint.classList.contains('err')) cdHint.textContent = t('cd.hint');
    if (CD.running) cdRender();
    if (tInterval) showPhase();
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    applyLang(LANG === 'ru' ? 'en' : 'ru');
  });

  applyLang(LANG);
  cdRestore();

  /* ============ SERVICE WORKER + ОБНОВЛЕНИЯ ============ */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // если уже есть ожидающий воркер — показать баннер
        if (reg.waiting) showUpdateBanner(reg.waiting);

        // следим за появлением новой версии
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(nw); // новая версия готова, старая ещё активна
            }
          });
        });

        // проверять обновления при возврате в приложение
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update();
        });
      }).catch(() => {});

      // когда новый воркер взял управление — перезагрузить страницу
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }

  function showUpdateBanner(worker) {
    const banner = document.getElementById('updateBanner');
    banner.classList.remove('hidden');
    document.getElementById('updateBtn').onclick = () => {
      worker.postMessage({ type: 'SKIP_WAITING' });
      banner.classList.add('hidden');
    };
  }
</script>

</body>
</html>
