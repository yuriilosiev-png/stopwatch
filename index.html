<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>Секундомер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Секундомер">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0f;
    --fg: #f2f4f8;
    --accent: #3ddc97;
    --stop: #ff5a5f;
    --reset: #6b7280;
    --dim: #1a1c24;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 56px;
    background:
      radial-gradient(circle at 50% 28%, rgba(61,220,151,0.08), transparent 60%),
      var(--bg);
  }

  .time {
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Roboto Mono", "Consolas", monospace;
    font-weight: 300;
    letter-spacing: 1px;
    line-height: 1;
    text-align: center;
  }

  .time .main {
    font-size: clamp(56px, 22vw, 120px);
  }

  .time .ms {
    font-size: clamp(24px, 9vw, 48px);
    color: var(--accent);
    margin-left: 4px;
  }

  .running .main { color: var(--fg); }

  .controls {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 420px;
  }

  button {
    flex: 1;
    border: none;
    border-radius: 22px;
    padding: 22px 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #0a0a0f;
    cursor: pointer;
    transition: transform .08s ease, opacity .15s ease;
  }

  button:active { transform: scale(0.94); }

  #startStop { background: var(--accent); }
  #startStop.stop { background: var(--stop); color: #fff; }

  #reset {
    background: var(--dim);
    color: var(--fg);
    border: 1px solid #2a2d38;
  }

  #reset:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

  <div class="time" id="display">
    <span class="main" id="main">00:00</span><span class="ms" id="ms">.00</span>
  </div>

  <div class="controls">
    <button id="startStop">Старт</button>
    <button id="reset" disabled>Сброс</button>
  </div>

<script>
  const mainEl  = document.getElementById('main');
  const msEl    = document.getElementById('ms');
  const ssBtn   = document.getElementById('startStop');
  const resetBtn= document.getElementById('reset');

  let startTime = 0;      // момент старта (с поправкой на накопленное)
  let elapsed   = 0;      // накопленные мс при паузе
  let running   = false;
  let rafId     = null;

  function format(t) {
    const totalMs = Math.floor(t);
    const ms  = Math.floor((totalMs % 1000) / 10);
    const sec = Math.floor(totalMs / 1000) % 60;
    const min = Math.floor(totalMs / 60000) % 60;
    const hr  = Math.floor(totalMs / 3600000);

    const pad = n => String(n).padStart(2, '0');
    const main = hr > 0
      ? `${pad(hr)}:${pad(min)}:${pad(sec)}`
      : `${pad(min)}:${pad(sec)}`;
    return { main, ms: '.' + pad(ms) };
  }

  function render(t) {
    const f = format(t);
    mainEl.textContent = f.main;
    msEl.textContent   = f.ms;
  }

  function tick() {
    const now = performance.now();
    render(elapsed + (now - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
    ssBtn.textContent = 'Стоп';
    ssBtn.classList.add('stop');
    resetBtn.disabled = false;
  }

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTime;
    render(elapsed);
    ssBtn.textContent = 'Старт';
    ssBtn.classList.remove('stop');
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    render(0);
    ssBtn.textContent = 'Старт';
    ssBtn.classList.remove('stop');
    resetBtn.disabled = true;
  }

  ssBtn.addEventListener('click', () => running ? stop() : start());
  resetBtn.addEventListener('click', reset);

  // При открытии — всё на нуле
  render(0);

  // Регистрация service worker для офлайн-работы
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
