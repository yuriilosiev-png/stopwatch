name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия кэша sw.js из хеша index.html
        run: |
          HASH=$(sha256sum index.html | cut -c1-8)
          if ! grep -q "stopwatch-$HASH" sw.js; then
            sed -i "s/const CACHE = '.*';/const CACHE = 'stopwatch-$HASH';/" sw.js
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add sw.js
            git commit -m "sw.js: кэш $HASH [skip ci]"
            git push
          fi

      - name: Copy root index.html into assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-release-aab
          path: app/build/outputs/bundle/release/*.aab
