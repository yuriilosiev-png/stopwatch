<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нет соединения</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:20px; padding:24px;
         background:#0a0a0f; color:#fff; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         text-align:center; }
  p { color:#8a8a99; line-height:1.5; max-width:320px; }
  a { background:#3ddc97; color:#0a0a0f; text-decoration:none; font-weight:700;
      padding:14px 28px; border-radius:16px; }
</style>
</head>
<body>
  <h2 id="t">Нет соединения</h2>
  <p id="m">Первый запуск требует интернета — приложение сохранит себя в память телефона и дальше будет работать без сети.</p>
  <a id="b" href="https://yuriilosiev-png.github.io/stopwatch/index.html">Повторить</a>
<script>
(function () {
  // страница лежит в assets, это отдельный origin — сохранённый выбор языка отсюда не виден,
  // поэтому ориентируемся на язык системы
  var lang = (navigator.language || 'en').toLowerCase();
  if (lang.indexOf('ru') === 0) return;   // разметка уже на русском

  document.documentElement.lang = 'en';
  document.title = 'No connection';
  document.getElementById('t').textContent = 'No connection';
  document.getElementById('m').textContent =
    'The first launch needs the internet — the app saves itself to your phone and works without a network afterwards.';
  document.getElementById('b').textContent = 'Retry';
})();
</script>
</body>
</html>
