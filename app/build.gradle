plugins { id 'com.android.application' }

// Номер сборки берётся из счётчика прогонов GitHub Actions и растёт сам.
// Локально (без CI) подставляется 1.
def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'com.yuriilosiev.stopwatch'
    compileSdk 36

    defaultConfig {
        applicationId "com.yuriilosiev.stopwatch"
        minSdk 24
        targetSdk 36
        versionCode buildNumber
        versionName "1.0." + buildNumber
        resConfigs "en", "ru"
    }

    // Подпись релиза: активна только если в окружении есть переменные
    // (в GitHub Actions они приходят из secrets, локально их просто нет).
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    // R8 включён по рекомендации Play Console (память и скорость). Правила, которые
    // берегут мост Android для страницы, — в proguard-rules.pro. R8 включён и в debug:
    // APK, который ставится на телефон для проверки, собирается так же, как AAB для Play.
    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Зависимостей нет: обёртке достаточно системного Activity и WebView.
    // Так в classpath не попадает Kotlin и не возникает конфликта stdlib-jdk7/jdk8.
}
